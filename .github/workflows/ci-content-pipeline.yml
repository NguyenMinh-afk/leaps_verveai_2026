name: CI — Content Pipeline

on:
  push:
    branches: [main, develop]
    paths: ['content-pipeline/**', '.github/workflows/ci-content-pipeline.yml']
  pull_request:
    branches: [main, develop]
    paths: ['content-pipeline/**', '.github/workflows/ci-content-pipeline.yml']

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: content-pipeline/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: content-pipeline/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
