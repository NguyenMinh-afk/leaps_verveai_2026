name: CI — Research

on:
  push:
    branches: [main, develop]
    paths: ['research/**', '.github/workflows/ci-research.yml']
  pull_request:
    branches: [main, develop]
    paths: ['research/**', '.github/workflows/ci-research.yml']

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -e . pytest
      - run: pytest --tb=short

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install flake8
      - run: flake8 src/ --max-line-length=120 --extend-ignore=E203,W503
