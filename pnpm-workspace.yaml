packages:
  # Phase 2: Backend Microservices
  - 'service/shared/common-node'
  - 'service/shared/consul-client'
  - 'service/shared/circuit-breaker'
  - 'service/shared/jwt-utils'
  - 'service/shared/tracing'
  - 'service/shared/error-types'
  - 'service/shared/prisma-schema'
  - 'service/gateway'
  - 'service/service-auth'
  - 'service/service-bkt'
  - 'service/service-class'
  - 'service/service-content'
  - 'service/service-sync'
  - 'service/service-assignment'
  - 'service/service-exam'
  - 'service/service-ai'
  # Phase 1: Content Pipeline
  - 'content-pipeline'
  - 'review-console'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  node: true
  prisma: true
  protobufjs: true
# `app/` là Flutter (pubspec.yaml), không phải pnpm package.
# `research/` là Python (pyproject.toml), không phải pnpm package.

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - bcrypt
  - esbuild
  - node
  - prisma
  - protobufjs
