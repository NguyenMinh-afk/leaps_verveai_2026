name: nekopath_app
description: NEKOPATH — App Flutter/Dart chạy 100% offline, chẩn đoán kiến thức cho học sinh.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === Lưu trữ (TS-05) ===
  sqflite: ^2.3.3+1          # SQLite, 1 file/cơ sở, append-only
  sqflite_common_ffi: ^2.3.3 # Hỗ trợ desktop (Windows)
  path: ^1.9.0
  path_provider: ^2.1.4

  # === Mã hoá (TS-10) ===
  cryptography: ^2.7.0       # libsodium-equivalent cho Dart
  cryptography_flutter: ^2.3.4
  pointycastle: ^3.9.1       # Ed25519 cho ký gói nội dung

  # === Mạng nội bộ — hub cục bộ (TS-08, TS-09) ===
  http: ^1.2.2               # HTTP nội bộ qua mDNS
  network_info_plus: ^6.1.0
  qr_flutter: ^4.1.0         # QR ghép nối 6 số
  mobile_scanner: ^5.2.3     # Quét QR từ thiết bị khác

  # === FFI llama.cpp (TS-02) — chỉ dùng khi `inference/` ra khỏi [A] ===
  ffi: ^2.1.3

  # === Tiện ích ===
  uuid: ^4.5.1               # eventId UUIDv7
  intl: ^0.20.3
  csv: ^6.0.0
  archive: ^3.6.1            # TS-11: archive mã hoá cho USB

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true